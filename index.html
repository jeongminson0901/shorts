<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>가을 피크닉 숏츠</title>
    <meta name="description" content="가을 피크닉을 떠나고 싶은 30초 키네틱 타이포 숏츠" />
    <meta property="og:title" content="가을 피크닉 숏츠" />
    <meta property="og:description" content="가을 피크닉을 떠나고 싶은 30초 키네틱 타이포 숏츠" />
    <meta property="og:type" content="video.other" />
    <meta property="og:video" content="autumn-picnic.mp4" />
    <style>
      :root {
        --bg: #fff4e0;
        --ink: #3b2414;
        --accent: #c73e1d;
        --muted: #8a6a52;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #241710;
          --ink: #fff4e0;
          --accent: #f2a93b;
          --muted: #c9ab8f;
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        min-height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      }
      main {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px 16px;
      }
      h1 {
        font-size: clamp(22px, 5vw, 30px);
        letter-spacing: -0.02em;
      }
      h1 span {
        color: var(--accent);
      }
      .frame {
        width: min(100%, calc((100svh - 140px) * 9 / 16), 420px);
        aspect-ratio: 9 / 16;
        border-radius: 22px;
        overflow: hidden;
        background: #000;
        box-shadow: 0 18px 40px rgba(59, 36, 20, 0.28);
      }
      video {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }
      p {
        font-size: 14px;
        color: var(--muted);
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>가을 <span>피크닉</span> 숏츠</h1>
      <div class="frame">
        <video src="autumn-picnic.mp4" controls autoplay muted loop playsinline preload="auto"></video>
      </div>
      <p>소리는 영상의 스피커 버튼을 눌러 켜 주세요 · <a href="autumn-picnic.mp4" download>MP4 내려받기</a></p>
    </main>
  </body>
</html>
